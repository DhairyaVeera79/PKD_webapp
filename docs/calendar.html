<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- In the head section -->
    <script src="./js/search.js"></script>
    <script src="./js/navbar.js"></script>
    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css">
<style>
    body {
        padding-left: 75px;
        padding-right: 75px;
    }
    
    .container {
        padding-left: 0;
        padding-right: 0;
        max-width: 100%;
    }
    
    main {
        padding-left: 0;
        padding-right: 0;
    }
    
    .year-view {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }
    .month {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        background-color: #f9f9f9;
        cursor: pointer;
    }
    .month h3 {
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 10px;
    }
    .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 0.9rem;
    }
    .day {
        padding: 2px;
        position: relative;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 2px auto;
    }
    .day-header {
        font-weight: bold;
        padding: 2px;
        text-align: center;
    }
    .day.empty {
        visibility: hidden;
    }
    .day.event-day {
        color: #ff6200;
        font-weight: bold;
    }
    .day.event-day::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 24px;
        height: 24px;
        background-color: #ff6200; 
        border-radius: 100%;
        z-index: -1;
    }
    .year-navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .year-title {
        text-align: center;
        font-size: 1.5rem;
        font-weight: bold;
    }
    .gujarati-tooltip {
        font-size: 0.7em;
        color: #666;
        display: none;
        position: absolute;
        bottom: -18px;
        left: 0;
        right: 0;
        text-align: center;
    }
    .day:hover .gujarati-tooltip {
        display: block;
    }
</style>

</head>
<body>
    

    <main class="container my-5 pt-5" style="padding-top: 160px;">
        
<section>
    <div class="row mb-4">
        <div class="col-md-6">
            <input type="number" id="year" class="form-control" placeholder="Year" min="1867" max="1901">
        </div>
        <div class="col-md-4">
            <select id="month" class="form-control">
                <option value="">Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>
        <div class="col-md-2">
            <button id="search-btn" class="btn btn-primary w-100">Search</button>
        </div>
    </div>
    <div id="year-navigation" class="year-navigation" style="display: none;">
        <button id="prev-year" class="btn btn-secondary">Previous</button>
        <div id="year-title" class="year-title">1867</div>
        <button id="next-year" class="btn btn-secondary">Next</button>
    </div>
    <div id="calendar"></div>
    <div id="year-view" class="year-view" style="display: none;"></div>
</section>

    </main>

    <footer class="bg-light py-3">
        <div class="text-center mt-4">
            <p>&copy; Copyright 2025. Shrimad Rajchandra Mission Dharampur. All rights reserved. <a href="#">Terms of service</a> | <a href="#">Privacy Policy</a></p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="./js/scripts.js"></script>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
<script>
    $(document).ready(function() {
        // Add Gujarati calendar data
        const gujaratiMonths = [
            'કારતક', 'માગશર', 'પોષ', 'મહા', 'ફાગણ', 'ચૈત્ર',
            'વૈશાખ', 'જેઠ', 'અષાઢ', 'શ્રાવણ', 'ભાદરવો', 'આસો'
        ];
        const gujaratiDayNames = ['ર', 'સો', 'મં', 'બુ', 'ગુ', 'શુ', 'શ'];

        // Simple conversion to Vikram Samvat
        function toVikramSamvat(year, month, day) {
            // Gujarati new year starts around Diwali (Oct-Nov)
            const isAfterNewYear = month > 9 || (month === 9 && day >= 20);
            return year + (isAfterNewYear ? 57 : 56);
        }

        // Your original constants and functions remain unchanged
        const months = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];
        const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

        const daysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
        let currentYear = 1867;

        function dateHasEvent(year, month, day) {
            const date = moment(`${year}-${month+1}-${day}`, 'YYYY-M-D');
            const events = $('#calendar').fullCalendar('clientEvents');
            return events.some(event => moment(event.start).isSame(date, 'day'));
        }

        // Modified renderYearView to add Gujarati dates
        const renderYearView = (year) => {
            currentYear = year;
            const yearView = $('#year-view');
            yearView.empty();

            // Add Vikram Samvat year to title
            const vikramYear = toVikramSamvat(year, 0, 1);
            $('#year-title').text(`${year} (Vikram ${vikramYear - 1} - ${vikramYear})`);

            for (let i = 0; i < 12; i++) {
                const monthDiv = $('<div>').addClass('month').data('month', i + 1);
                monthDiv.append($('<h3>').text(months[i])); // Keep original month names

                const daysDiv = $('<div>').addClass('days');
                
                // Keep original day headers
                dayNames.forEach(day => {
                    daysDiv.append($('<div>').addClass('day-header').text(day));
                });

                // Empty days for alignment
                const firstDay = new Date(year, i, 1).getDay();
                for (let j = 0; j < firstDay; j++) {
                    daysDiv.append($('<div>').addClass('day empty'));
                }

                // Add days of month
                const daysInCurrentMonth = daysInMonth(i, year);
                for (let d = 1; d <= daysInCurrentMonth; d++) {
                    const dayContainer = $('<div>').addClass('day-container');
                    const dayDiv = $('<div>').addClass('day').text(d);
                    
                    // Add Gujarati date as subtle tooltip
                    const vikramDate = toVikramSamvat(year, i, d);
                    const gujDate = $('<div>').addClass('gujarati-tooltip').text(d);
                    
                    dayContainer.append(dayDiv);
                    dayContainer.append(gujDate);
                    
                    if (dateHasEvent(year, i, d)) {
                        dayDiv.addClass('event-day');
                    }
                    daysDiv.append(dayContainer);
                }

                monthDiv.append(daysDiv);
                yearView.append(monthDiv);
            }
        };

        // Rest of your original JavaScript remains EXACTLY THE SAME
        const openMonthView = (year, month) => {
            const paddedMonth = month.toString().padStart(2, '0');
            $('#calendar').fullCalendar('gotoDate', `${year}-${paddedMonth}-01`);
            $('#calendar').show();
            $('#year-view').hide();
            $('#year-navigation').hide();
        };

        $('#calendar').fullCalendar({
            defaultDate: '1867-11-01',
            header: {
                left: 'prev,next',
                center: 'title',
                right: 'month,year'
            },
            customButtons: {
                year: {
                    text: 'year',
                    click: function() {
                        const currentDate = $('#calendar').fullCalendar('getDate');
                        currentYear = currentDate.year();
                        renderYearView(currentYear);
                        $('#calendar').hide();
                        $('#year-view').show();
                        $('#year-navigation').show();
                    }
                }
            },
            events: [
                {
                    title: 'Param Krupalu Dev Born',
                    start: '1867-11-09',
                    description: 'Place: Vavaniya'
                }
            ],
            eventRender: function(event, element) {
                if (event.description) {
                    const descriptionParts = event.description.split('Vavaniya');
                    const descriptionWithLink = descriptionParts[0] +
                        '<a href="' + "./places/vavaniya.html" + '" class="dynamic-link">Vavaniya</a>' +
                        descriptionParts[1];

                    element.find('.fc-title').append('<br/><span class="fc-description">' + descriptionWithLink + '</span>');
                }

                element.css('background-color', '#E6E6E6');
                element.css('color', 'black');
                element.css('border-color', '#E6E6E6');
                
                // Add Gujarati date to event tooltip
                const start = moment(event.start);
                const vikramDate = toVikramSamvat(start.year(), start.month(), start.date());
                element.attr('title', 
                    `${event.title}\n` +
                    `English: ${start.format('YYYY-MM-DD')}\n` +
                    `Vikram Samvat: ${vikramDate}`
                );
            }
        });

        // Initialize the view
        renderYearView(currentYear);
        $('#year-navigation').show();
        $('#year-view').show();
        $('#calendar').hide();

        // Rest of your original event handlers remain unchanged
        $('#year-view').on('click', '.month', function() {
            const month = parseInt($(this).data('month'), 10);
            openMonthView(currentYear, month);
        });

        $('#search-btn').on('click', function() {
            const year = $('#year').val();
            const month = $('#month').val();
            
            if (year && month) {
                $('#calendar').fullCalendar('gotoDate', `${year}-${month.padStart(2, '0')}-01`);
                $('#year-view').hide();
                $('#year-navigation').hide();
                $('#calendar').show();
            } else if (year) {
                renderYearView(year);
                $('#calendar').hide();
                $('#year-view').show();
                $('#year-navigation').show();
            }
        });

        $('#prev-year').on('click', function() {
            renderYearView(currentYear - 1);
        });

        $('#next-year').on('click', function() {
            renderYearView(currentYear + 1);
        });
    });
</script>

</body>
</html>
