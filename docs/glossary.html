<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossary</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .glossary-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
        }

        .glossary-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .glossary-header h1 {
            color: #333;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .glossary-header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Statistics/Filter Bar */
        .stats-filter-bar {
            background-color: #EFEDE7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stats-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .filter-btn {
            background-color: #fff;
            border: 2px solid #C66A11;
            color: #C66A11;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            outline: none; /* Remove default focus outline */
        }

        .filter-btn:hover {
            background-color: #C66A11;
            color: #fff;
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background-color: #C66A11;
            color: #fff;
        }

        .filter-btn:focus {
            outline: none; /* Remove focus outline */
            box-shadow: none; /* Remove any focus box-shadow */
        }

        .filter-btn:active {
            outline: none; /* Remove active state outline */
            box-shadow: none; /* Remove any active box-shadow */
        }

        .filter-btn .count {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-left: 6px;
        }

        .filter-btn.active .count {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Simple Search Bar */
        .simple-search {
            margin-bottom: 20px;
        }

        .simple-search input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .simple-search input:focus {
            border-color: #C66A11;
        }

        /* Dictionary-like Content */
        .dictionary-content {
            background-color: #fff;
            text-align: left; /* Ensure left alignment for dictionary content */
        }

        .dictionary-entry {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            margin-bottom: 0;
            text-align: left; /* Explicit left alignment for entries */
        }

        .dictionary-entry:last-child {
            border-bottom: none;
        }

        .term-word {
            font-weight: 600;
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 5px;
            text-align: left; /* Left align term names */
        }

        .term-pronunciation {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-align: left; /* Left align pronunciation */
        }

        .term-definition {
            color: #555;
            line-height: 1.6;
            margin-bottom: 8px;
            text-align: left; /* Left align definitions */
        }

        .term-category-tag {
            display: inline-block;
            background-color: #f0f0f0;
            color: #666;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .term-category-tag.person { background-color: #e8f5e8; color: #2d5a2d; }
        .term-category-tag.place { background-color: #e8f4f8; color: #1f4e79; }
        .term-category-tag.concept { background-color: #f0e8f8; color: #5d2e5d; }
        .term-category-tag.composition { background-color: #fff4e8; color: #8b4513; }
        .term-category-tag.event { background-color: #ffe8e8; color: #8b0000; }

        /* Link icon styling */
        .term-link-icon {
            display: inline-block;
            margin-left: 8px;
            color: #C66A11;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            border: 1.5px solid #C66A11;
            padding: 3px;
            border-radius: 4px;
            font-weight: bold;
            width: 16px;
            height: 16px;
            text-align: center;
            line-height: 10px;
        }

        .term-link-icon:hover {
            color: #fff;
            background-color: #C66A11;
            transform: translateY(-1px);
            text-decoration: none;
        }

        .term-word-container {
            display: flex;
            align-items: center;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            background-color: #f9f9f9;
            border-radius: 8px;
            margin: 20px 0;
        }

        .no-results h3 {
            color: #C66A11;
            margin-bottom: 10px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .filter-buttons {
                gap: 8px;
            }
            
            .filter-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            
            .term-word {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <main class="container-fluid mt-5 pt-5">
        <div class="glossary-container">
            <!-- Header -->
            <div class="glossary-header">
                <h1>Glossary</h1>
                <p>A comprehensive dictionary of terms related to Shrimad Rajchandraji</p>
            </div>

            <!-- Statistics and Filter Bar -->
            <div class="stats-filter-bar">
                <div class="stats-title">Browse by Category</div>
                <div class="filter-buttons" id="filterButtons">
                    <!-- Filter buttons will be generated by JavaScript -->
                </div>
            </div>

            <!-- Simple Search -->
            <div class="simple-search">
                <input type="text" id="searchInput" placeholder="Search for a term..." aria-label="Search glossary terms">
            </div>

            <!-- Dictionary Content -->
            <div id="dictionaryContent" class="dictionary-content">
                <!-- Terms will be loaded here by JavaScript -->
            </div>

            <!-- No Results -->
            <div id="noResults" class="no-results" style="display: none;">
                <h3>No terms found</h3>
                <p>Try adjusting your search criteria or select a different category.</p>
            </div>
        </div>
    </main>

    <footer class="bg-light py-3 mt-5">
        <div class="text-center">
            <p>&copy; An independent research website on the life and teachings of Shrimad Rajchandraji.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/scripts.js"></script>
    
    <script>
        // Glossary terms data
        const glossaryTerms = [
            // ===== PEOPLE (27) =====
            {
                name: "Param Krupalu Dev",
                definition: "Another name for Shrimad Rajchandraji, meaning 'One who is supremely compassionate.' Used reverentially by devotees.",
                category: "person",
                letter: "P"
            },
            {
                name: "Shrimad Rajchandraji",
                definition: "A self-realised saint, reformer of Jainism, and remarkable poet-philosopher (V.S. 1924\u20131957 / 1867\u20131901). Born in Vavaniya, attained dehvilay in Rajkot at age 33. Spiritual guide of Mahatma Gandhi.",
                category: "person",
                letter: "S"
            },
            {
                name: "Juthabhai",
                definition: "Full name: Shri Juthabhai Ujamshibhai. Given the pet name 'Satyaparayan' (devoted to truth). First samarpit shishya of Param Krupalu Dev. Born Kartik Sud 2, V.S. 1923. Attained samyaktva. Passed away at age 23, V.S. 1946.",
                category: "person",
                letter: "J"
            },
            {
                name: "Saubhagyabhai",
                definition: "Full name: Shri Saubhagyabhai Lallubhai, from Sayla. Given titles 'Hridayroop' and 'Param Vishraam'. Param Krupalu Dev's divine soulmate and foremost devotee. Received ~244 letters. Instrumental in the composition of Shri Atmasiddhi Shastra. Passed away in samadhi, V.S. 1953.",
                category: "person",
                letter: "S"
            },
            {
                name: "Ambalalbhai",
                definition: "Full name: Shri Ambalalbhai Lalchandbhai, native of Khambhat. Served Param Krupalu Dev tirelessly; held lantern during composition of Atmasiddhi Shastra. Attained self-realisation in Ahmedabad (V.S. 1957). Co-published first edition of 'Shrimad Rajchandra'. Passed away V.S. 1963 at age 37.",
                category: "person",
                letter: "A"
            },
            {
                name: "Lalluji Muni",
                definition: "Also known as Prabhushri / Shri Laghuraj Swami. Born V.S. 1910 in Vataman. Initiated as Sthanakvasi monk in Khambhat. First met Param Krupalu Dev on Dhanteras, V.S. 1946. Attained self-realisation in Vaso (V.S. 1954). Founded Shrimad Rajchandra Ashram, Agas. Called 'Muni of the fourth era'.",
                category: "person",
                letter: "L"
            },
            {
                name: "Gandhiji",
                definition: "Mahatma Gandhi, who considered Shrimad Rajchandraji as his foremost spiritual guide. First met Him in V.S. 1947 at Dr. Pranjivandas's home in Mumbai. Sent 27 questions from Africa which Param Krupalu Dev answered with lucid logic.",
                category: "person",
                letter: "G"
            },
            {
                name: "Pujya Gurudevshri Rakeshji",
                definition: "Founder of Shrimad Rajchandra Mission Dharampur. Born September 26, 1966 in Mumbai. Ph.D. on 'Atmasiddhi Shastra' from Mumbai University. Author of 'Shrimad Rajchandra \u2013 Jeevan ane Kavan' (2001). Established ashram at Dharampur on 223 acres, hillock of Mohangadh.",
                category: "person",
                letter: "P"
            },
            {
                name: "Devba",
                definition: "Mother of Param Krupalu Dev. Daughter of Shri Raghavjibhai of Maliya. Born in a Jain family; followed the Jain way of life even after marrying Ravjibhai. Simple, cultured, and soft-hearted.",
                category: "person",
                letter: "D"
            },
            {
                name: "Ravjibhai",
                definition: "Father of Param Krupalu Dev. Born V.S. 1902. Moneylender in Vavaniya and nearby Chamanpar. Followed Vaishnav religion. Kind-hearted and charitable; served monks, saints and fakirs.",
                category: "person",
                letter: "R"
            },
            {
                name: "Jhabakben",
                definition: "Wife of Param Krupalu Dev. Daughter of Shri Popatlalbhai Mehta, from a Sthanakvasi Jain family. Married in Morbi on Maha Sud 12, V.S. 1944. After Param Krupalu Dev's passing, spent time in solitude. Passed away V.S. 1969.",
                category: "person",
                letter: "J"
            },
            {
                name: "Shivkunvarben",
                definition: "Eldest sister of Param Krupalu Dev, first child of Ravjibhai and Devba. Married Shri Chatrabhujbhai Bechar of Jetpar.",
                category: "person",
                letter: "S"
            },
            {
                name: "Brahmachariji",
                definition: "Brahmachariji Shri Govardhandasji, key disciple of Pujyashree Lalluji Muni at Agas Ashram. Acquired a very high spiritual state. Wrote 'Shrimad Rajchandra Jeevankala'. Performed pratishta of Param Krupalu Dev's images and temples.",
                category: "person",
                letter: "B"
            },
            {
                name: "Chatrabhujbhai Bechar",
                definition: "Brother-in-law of Param Krupalu Dev (Shivkunvarben's husband), from Jetpar. Param Krupalu Dev frequently stayed at his home. Saubhagyabhai's first meeting with Param Krupalu Dev took place at his residence (V.S. 1946).",
                category: "person",
                letter: "C"
            },
            {
                name: "Popatbhai Jagjivan",
                definition: "Father-in-law of Param Krupalu Dev (Shri Popatlalbhai Mehta). Elder brother of Shri Revashankarbhai Jagjivan and Dr. Pranjivandas. Father of Jhabakben.",
                category: "person",
                letter: "P"
            },
            {
                name: "Dr. Pranjivandas Jagjivan",
                definition: "Chief Medical Officer of Idar State. Brother of Shri Revashankarbhai Jagjivan and Shri Popatlalbhai Mehta. Param Krupalu Dev stayed at his residence during the Idar retreat. Introduced Param Krupalu Dev and Gandhiji in Mumbai.",
                category: "person",
                letter: "D"
            },
            {
                name: "Maneklal Ghelabhai",
                definition: "Of Vadodara. Drawn to Param Krupalu Dev at the shatavdhan in Mumbai. Father was an expert in precious stone valuation. Taught Param Krupalu Dev the jewellery trade (zaverat). Business partner in Revashankar Jagjivan Co.",
                category: "person",
                letter: "M"
            },
            {
                name: "Revashankar Jagjivan",
                definition: "Param Krupalu Dev's wife's uncle (Jhabakben's father's brother). Previously a lawyer in Morbi. Co-founded Revashankar Jagjivan Co. jewellery business in Mumbai. Chief executive of Paramshrut Prabhavak Mandal.",
                category: "person",
                letter: "R"
            },
            {
                name: "Shankarlal Bhatt",
                definition: "Also known as Shankar Pancholi. Performed 8 avdhans in Morbi that inspired Param Krupalu Dev to perform His first avdhan. Also a renowned astrologer. Was spellbound by Param Krupalu Dev's nashtavidya demonstration.",
                category: "person",
                letter: "S"
            },
            {
                name: "Chanchalben",
                definition: "Second wife of Param Krupalu Dev in His previous birth as a prince (Rajkuvar) of Nepal/Tibet, before He became a Digamber Sadhu in Idar.",
                category: "person",
                letter: "C"
            },
            {
                name: "Javalben",
                definition: "First daughter of Param Krupalu Dev, born V.S. 1948. Together with her husband Bhagvanbhai Modi, constructed a temple in Vavaniya in 1946 AD. Passed away V.S. 2034.",
                category: "person",
                letter: "J"
            },
            {
                name: "Bhagvanbhai Modi",
                definition: "Son-in-law of Param Krupalu Dev, son of Ranchodbhai of Dharampur. Together with his wife Javalben, constructed a temple in Vavaniya in 1946 AD.",
                category: "person",
                letter: "B"
            },
            {
                name: "Ranchodbhai",
                definition: "Father of Bhagvanbhai Modi, from Dharampur.",
                category: "person",
                letter: "R"
            },
            {
                name: "Janbai",
                definition: "Paternal aunt (Foiba) of Param Krupalu Dev. Resided in Morbi.",
                category: "person",
                letter: "J"
            },
            {
                name: "Tribhuvan Bhanji",
                definition: "Full name: Shri Tribhuvanbhai Manekchand. Friend of Ambalalbhai from Khambhat. Son of Shri Manekchandbhai. Accompanied Ambalalbhai to meet Param Krupalu Dev in Mumbai.",
                category: "person",
                letter: "T"
            },
            {
                name: "Vinaychandrabhai Popatbhai Daftary",
                definition: "Contemporary and companion of Param Krupalu Dev from Morbi. Wrote the book 'Sakshat Saraswati' recording Param Krupalu Dev's avdhan demonstrations. Gave letter of recommendation for Sheth Jesangbhai for the publication of Mokshmala.",
                category: "person",
                letter: "V"
            },
            {
                name: "Lord Mahavir",
                definition: "The 24th and last Jain Tirthankara who attained nirvana over 2,500 years ago. Param Krupalu Dev followed His path and teachings.",
                category: "person",
                letter: "L"
            },

            // ===== PLACES (22) =====
            {
                name: "Vavaniya",
                definition: "Birthplace of Param Krupalu Dev, in Morbi district, Saurashtra. Once a 'bandar' (port) with cargo ships. Shri Panchanbhai moved here from Manekwada in V.S. 1892. A temple was constructed here by Javalben and Bhagvanbhai Modi in 1946 AD.",
                category: "place",
                letter: "V"
            },
            {
                name: "Morbi",
                definition: "City in Saurashtra where Param Krupalu Dev studied at the Anglo-Vernacular school (V.S. 1937\u20131940), married Jhabakben (V.S. 1944), and performed His first avdhans after watching Shastri Shankarlal Bhatt.",
                category: "place",
                letter: "M"
            },
            {
                name: "Mumbai",
                definition: "Where Param Krupalu Dev conducted the Revashankar Jagjivan Co. jewellery business from V.S. 1945. Site of the famous shatavdhan at Framjee Cawasjee Institute (January 22, 1887). Where He met Gandhiji (V.S. 1947).",
                category: "place",
                letter: "M"
            },
            {
                name: "Ahmedabad",
                definition: "Where Param Krupalu Dev published Mokshmala (V.S. 1944) and first met Juthabhai. Ambalalbhai attained self-realisation here (V.S. 1957). 52 avdhans performed in Sheth Dalpatbhai Bhagubhai's compound.",
                category: "place",
                letter: "A"
            },
            {
                name: "Rajkot",
                definition: "Where Param Krupalu Dev's maternal relatives lived and He studied briefly. Site of His dehvilay on Chaitra Vad 5, V.S. 1957 (April 9, 1901). Samadhi Sthal (memorial) built here. Gandhiji went directly to the memorial upon his first visit.",
                category: "place",
                letter: "R"
            },
            {
                name: "Khambhat",
                definition: "Native place of Ambalalbhai. Where Lalluji Muni was initiated as a monk (V.S. 1940) and first met Param Krupalu Dev on Dhanteras, V.S. 1946. Also where Ambalalbhai passed away (V.S. 1963).",
                category: "place",
                letter: "K"
            },
            {
                name: "Kavitha",
                definition: "Site of Param Krupalu Dev's first major spiritual retreat (V.S. 1952) during Paryushan. He stayed at Shri Jhaverchand Sheth's residence, meditated at Vagadia lake, and counselled the bandit Babardeva who then reformed.",
                category: "place",
                letter: "K"
            },
            {
                name: "Uttarsanda",
                definition: "Site of Param Krupalu Dev's intense spiritual retreat (V.S. 1953). He was in an elevated spiritual state manifesting extraordinary radiance. Told Shri Motilal Bhavsar's wife Navalben she would attain liberation in her 8th life.",
                category: "place",
                letter: "U"
            },
            {
                name: "Idar",
                definition: "In north Gujarat. Site of Param Krupalu Dev's final spiritual retreat (V.S. 1955\u20131956), staying at Dr. Pranjivandas's residence. He explored hills and caves. In His previous birth, He was a Digamber Sadhu here.",
                category: "place",
                letter: "I"
            },
            {
                name: "Dharampur",
                definition: "In south Gujarat. Location of Shrimad Rajchandra Ashram (est. 2001), founded by Pujya Gurudevshri Rakeshji on 223 acres on hillock of Mohangadh. Bhagvanbhai Modi was originally from Dharampur.",
                category: "place",
                letter: "D"
            },
            {
                name: "Jetpar",
                definition: "In Saurashtra. Home of Shri Chatrabhujbhai Bechar (Shivkunvarben's husband). Param Krupalu Dev frequently stayed here. First meeting between Saubhagyabhai and Param Krupalu Dev took place here (V.S. 1946).",
                category: "place",
                letter: "J"
            },
            {
                name: "Jamnagar",
                definition: "Where Param Krupalu Dev performed 16 avdhans and received the title 'Hind na Heera' (The Jewel of Hind). His first photograph (chitrapat) was taken here at age 16.",
                category: "place",
                letter: "J"
            },
            {
                name: "Wadhwan",
                definition: "Present-day Surendranagar. Where 16 avdhans were performed before Colonel H. L. Natsaheb and 2,000 attendees. The famous photographs of Param Krupalu Dev were taken at Wadhwan Camp during a state of extreme dispassion.",
                category: "place",
                letter: "W"
            },
            {
                name: "Limbdi",
                definition: "Where Param Krupalu Dev performed 36 avdhans. Saubhagyabhai's father Shri Lallubhai was state administrator here before settling in Sayla.",
                category: "place",
                letter: "L"
            },
            {
                name: "Botad",
                definition: "Where Param Krupalu Dev performed 52 avdhans in the presence of Sheth Shri Harilal Shivlal.",
                category: "place",
                letter: "B"
            },
            {
                name: "Agas",
                definition: "Site of Shrimad Rajchandra Ashram, established Jeth Sud 5, V.S. 1976, by Lalluji Muni on 7.5 acres donated by Shri Jijibhai Kuberdas of Sandesar. Lalluji Muni spent 14 monsoons here and passed away here in V.S. 1992.",
                category: "place",
                letter: "A"
            },
            {
                name: "Vaso",
                definition: "Key spiritual site where Lalluji Muni stationed during monsoons. On the last day in Vaso (V.S. 1954), Param Krupalu Dev spoke to Lalluji Muni for one hour, conferring self-realisation upon him.",
                category: "place",
                letter: "V"
            },
            {
                name: "Sayla",
                definition: "Called 'the village of the devotees.' Home of Saubhagyabhai Lallubhai and Shri Dungarshibhai Gosalia.",
                category: "place",
                letter: "S"
            },
            {
                name: "Nepal",
                definition: "Region where Param Krupalu Dev was a Rajkuvar (prince) in His previous birth, before becoming a Digamber Sadhu in Idar.",
                category: "place",
                letter: "N"
            },
            {
                name: "Tibet",
                definition: "Region associated with Param Krupalu Dev's previous birth as Nepal's Rajkuvar.",
                category: "place",
                letter: "T"
            },
            {
                name: "Alfred High School",
                definition: "English education institution in Rajkot where Param Krupalu Dev's relatives suggested He study, but He chose to focus on spiritual pursuits instead.",
                category: "place",
                letter: "A"
            },
            {
                name: "Framjee Cawasjee Institute",
                definition: "Institution in Mumbai (at Dhobi Talao) where Param Krupalu Dev performed His famous shatavdhan on January 22, 1887, presided by Dr. Peterson.",
                category: "place",
                letter: "F"
            },

            // ===== CONCEPTS (38) =====
            {
                name: "Samyag Darshan",
                definition: "Right faith or right belief. First of the three jewels (ratnatraya) of Jainism. Also the first section of Mokshmala.",
                category: "concept",
                letter: "S"
            },
            {
                name: "Samyag Jnan",
                definition: "Right knowledge. Second of the three jewels (ratnatraya) of Jainism. Also the second section of Mokshmala.",
                category: "concept",
                letter: "S"
            },
            {
                name: "Samyag Charitra",
                definition: "Right conduct. Third of the three jewels (ratnatraya) of Jainism. Also the third section of Mokshmala.",
                category: "concept",
                letter: "S"
            },
            {
                name: "Samyaktva",
                definition: "The state of right perception or self-realisation. Param Krupalu Dev attained Shuddh Samyagdarshan (pure self-realisation) in V.S. 1947. He also conferred samyaktva upon His key devotees including Juthabhai, Saubhagyabhai, Ambalalbhai, and Lalluji Muni.",
                category: "concept",
                letter: "S"
            },
            {
                name: "Jatismaran Jnan",
                definition: "Knowledge of past lives. Param Krupalu Dev recalled past lives at age 7 (V.S. 1931) upon witnessing the cremation of Shri Amichandbhai in Vavaniya. He later said He could recall over 800 previous births.",
                category: "concept",
                letter: "J"
            },
            {
                name: "Avdhan",
                definition: "A genre of performance demonstrating extraordinary concentration, where a performer answers challenging questions from several questioners simultaneously while completing multiple parallel tasks.",
                category: "concept",
                letter: "A"
            },
            {
                name: "Shatavdhan",
                definition: "Performance of 100 simultaneous tasks. Param Krupalu Dev performed this at Framjee Cawasjee Institute in Mumbai on January 22, 1887, presided by Dr. Peterson. Awarded gold medal.",
                category: "concept",
                letter: "S"
            },
            {
                name: "Ashtavdhan",

        // Initialize glossary
        document.addEventListener('DOMContentLoaded', function() {
            loadNavbar();
            initializeGlossary();
        });

        function initializeGlossary() {
            generateFilterButtons();
            displayAllTerms();
            setupSearch();
        }

        function generateFilterButtons() {
            const filterButtonsContainer = document.getElementById('filterButtons');
            
            // Calculate counts for each category
            const counts = {
                all: glossaryTerms.length,
                person: glossaryTerms.filter(term => term.category === 'person').length,
                place: glossaryTerms.filter(term => term.category === 'place').length,
                concept: glossaryTerms.filter(term => term.category === 'concept').length,
                composition: glossaryTerms.filter(term => term.category === 'composition').length,
                event: glossaryTerms.filter(term => term.category === 'event').length
            };

            const categories = [
                { name: 'All Terms', category: 'all', count: counts.all },
                { name: 'People', category: 'person', count: counts.person },
                { name: 'Places', category: 'place', count: counts.place },
                { name: 'Concepts', category: 'concept', count: counts.concept },
                { name: 'Compositions', category: 'composition', count: counts.composition },
                { name: 'Events', category: 'event', count: counts.event }
            ];

            categories.forEach((cat, index) => {
                const button = document.createElement('button');
                button.innerHTML = `${cat.name} <span class="count">${cat.count}</span>`;
                button.className = 'filter-btn' + (index === 0 ? ' active' : '');
                button.dataset.category = cat.category;
                
                button.addEventListener('click', () => {
                    filterTermsByCategory(cat.category);
                    setActiveFilterButton(button);
                });
                
                filterButtonsContainer.appendChild(button);
            });
        }

        function displayAllTerms() {
            const sortedTerms = glossaryTerms.sort((a, b) => a.name.localeCompare(b.name));
            displayTerms(sortedTerms);
        }

        function filterTermsByCategory(category) {
            const filteredTerms = category === 'all' ? glossaryTerms : glossaryTerms.filter(term => term.category === category);
            displayTerms(filteredTerms);
        }

        function displayTerms(terms) {
            const content = document.getElementById('dictionaryContent');
            const noResults = document.getElementById('noResults');
            
            if (terms.length === 0) {
                content.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            content.style.display = 'block';
            noResults.style.display = 'none';

            content.innerHTML = '';

            terms.sort((a, b) => a.name.localeCompare(b.name)).forEach(term => {
                const termElement = createTermElement(term);
                content.appendChild(termElement);
            });
        }

        function createTermElement(term) {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'dictionary-entry';
            
            const hasPage = termPageMap[term.name];
            const linkIcon = hasPage ? `<a href="${hasPage}" class="term-link-icon" title="View details about ${term.name}">↗</a>` : '';
            
            entryDiv.innerHTML = `
                <div class="term-word-container">
                    <div class="term-word">${term.name}</div>
                    ${linkIcon}
                </div>
                <div class="term-pronunciation">${term.pronunciation || ''}</div>
                <div class="term-definition">${term.definition}</div>
                <span class="term-category-tag ${term.category}">${term.category}</span>
            `;
            
            return entryDiv;
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                if (query === '') {
                    displayAllTerms();
                    const allButton = document.querySelector('.filter-btn[data-category="all"]');
                    setActiveFilterButton(allButton);
                    return;
                }

                // Filter terms that match the query
                let filteredTerms = glossaryTerms.filter(term =>
                    term.name.toLowerCase().includes(query) ||
                    term.definition.toLowerCase().includes(query)
                );

                // Enhanced sorting with debug logging
                filteredTerms.sort((a, b) => {
                    const aName = a.name.toLowerCase();
                    const bName = b.name.toLowerCase();
                    const aDefinition = a.definition.toLowerCase();
                    const bDefinition = b.definition.toLowerCase();
                    const queryLower = query.toLowerCase();
                    
                    // Calculate scores for both terms
                    let scoreA = 0;
                    let scoreB = 0;
                    
                    // Scoring for term A
                    if (aName === queryLower) {
                        scoreA = 10000;
                    } else if (aName.startsWith(queryLower)) {
                        scoreA = 1000;
                    } else if (aName.includes(queryLower)) {
                        scoreA = 100;
                    } else if (aDefinition.includes(queryLower)) {
                        scoreA = 10;
                    }
                    
                    // Scoring for term B
                    if (bName === queryLower) {
                        scoreB = 10000;
                    } else if (bName.startsWith(queryLower)) {
                        scoreB = 1000;
                    } else if (bName.includes(queryLower)) {
                        scoreB = 100;
                    } else if (bDefinition.includes(queryLower)) {
                        scoreB = 10;
                    }
                    
                    // Debug logging for "vavan" search
                    if (query === 'vavan') {
                        console.log(`${a.name}: score=${scoreA}, ${b.name}: score=${scoreB}`);
                    }
                    
                    // Sort by score (higher first), then alphabetically
                    if (scoreA !== scoreB) {
                        return scoreB - scoreA;
                    }
                    return aName.localeCompare(bName);
                });

                displayTerms(filteredTerms);
                
                // Clear active filter button during search
                const buttons = document.querySelectorAll('.filter-btn');
                buttons.forEach(btn => btn.classList.remove('active'));
            });
        }

        function setActiveFilterButton(button) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }
    </script>
