        // Initialize glossary
        document.addEventListener('DOMContentLoaded', function() {
            loadNavbar();
            initializeGlossary();
        });

        function initializeGlossary() {
            generateFilterButtons();
            displayAllTerms();
            setupSearch();
        }

        function generateFilterButtons() {
            const filterButtonsContainer = document.getElementById('filterButtons');
            
            // Calculate counts for each category
            const counts = {
                all: glossaryTerms.length,
                person: glossaryTerms.filter(term => term.category === 'person').length,
                place: glossaryTerms.filter(term => term.category === 'place').length,
                concept: glossaryTerms.filter(term => term.category === 'concept').length,
                composition: glossaryTerms.filter(term => term.category === 'composition').length,
                event: glossaryTerms.filter(term => term.category === 'event').length
            };

            const categories = [
                { name: 'All Terms', category: 'all', count: counts.all },
                { name: 'People', category: 'person', count: counts.person },
                { name: 'Places', category: 'place', count: counts.place },
                { name: 'Concepts', category: 'concept', count: counts.concept },
                { name: 'Compositions', category: 'composition', count: counts.composition },
                { name: 'Events', category: 'event', count: counts.event }
            ];

            categories.forEach((cat, index) => {
                const button = document.createElement('button');
                button.innerHTML = `${cat.name} <span class="count">${cat.count}</span>`;
                button.className = 'filter-btn' + (index === 0 ? ' active' : '');
                button.dataset.category = cat.category;
                
                button.addEventListener('click', () => {
                    filterTermsByCategory(cat.category);
                    setActiveFilterButton(button);
                });
                
                filterButtonsContainer.appendChild(button);
            });
        }

        function displayAllTerms() {
            const sortedTerms = glossaryTerms.sort((a, b) => a.name.localeCompare(b.name));
            displayTerms(sortedTerms);
        }

        function filterTermsByCategory(category) {
            const filteredTerms = category === 'all' ? glossaryTerms : glossaryTerms.filter(term => term.category === category);
            displayTerms(filteredTerms);
        }

        function displayTerms(terms) {
            const content = document.getElementById('dictionaryContent');
            const noResults = document.getElementById('noResults');
            
            if (terms.length === 0) {
                content.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            content.style.display = 'block';
            noResults.style.display = 'none';

            content.innerHTML = '';

            terms.sort((a, b) => a.name.localeCompare(b.name)).forEach(term => {
                const termElement = createTermElement(term);
                content.appendChild(termElement);
            });
        }

        function createTermElement(term) {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'dictionary-entry';
            
            const hasPage = termPageMap[term.name];
            const linkIcon = hasPage ? `<a href="${hasPage}" class="term-link-icon" title="View details about ${term.name}">↗</a>` : '';
            
            entryDiv.innerHTML = `
                <div class="term-word-container">
                    <div class="term-word">${term.name}</div>
                    ${linkIcon}
                </div>
                <div class="term-pronunciation">${term.pronunciation || ''}</div>
                <div class="term-definition">${term.definition}</div>
                <span class="term-category-tag ${term.category}">${term.category}</span>
            `;
            
            return entryDiv;
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                if (query === '') {
                    displayAllTerms();
                    const allButton = document.querySelector('.filter-btn[data-category="all"]');
                    setActiveFilterButton(allButton);
                    return;
                }

                // Filter terms that match the query
                let filteredTerms = glossaryTerms.filter(term =>
                    term.name.toLowerCase().includes(query) ||
                    term.definition.toLowerCase().includes(query)
                );

                // Enhanced sorting with debug logging
                filteredTerms.sort((a, b) => {
                    const aName = a.name.toLowerCase();
                    const bName = b.name.toLowerCase();
                    const aDefinition = a.definition.toLowerCase();
                    const bDefinition = b.definition.toLowerCase();
                    const queryLower = query.toLowerCase();
                    
                    // Calculate scores for both terms
                    let scoreA = 0;
                    let scoreB = 0;
                    
                    // Scoring for term A
                    if (aName === queryLower) {
                        scoreA = 10000;
                    } else if (aName.startsWith(queryLower)) {
                        scoreA = 1000;
                    } else if (aName.includes(queryLower)) {
                        scoreA = 100;
                    } else if (aDefinition.includes(queryLower)) {
                        scoreA = 10;
                    }
                    
                    // Scoring for term B
                    if (bName === queryLower) {
                        scoreB = 10000;
                    } else if (bName.startsWith(queryLower)) {
                        scoreB = 1000;
                    } else if (bName.includes(queryLower)) {
                        scoreB = 100;
                    } else if (bDefinition.includes(queryLower)) {
                        scoreB = 10;
                    }
                    
                    // Debug logging for "vavan" search
                    if (query === 'vavan') {
                        console.log(`${a.name}: score=${scoreA}, ${b.name}: score=${scoreB}`);
                    }
                    
                    // Sort by score (higher first), then alphabetically
                    if (scoreA !== scoreB) {
                        return scoreB - scoreA;
                    }
                    return aName.localeCompare(bName);
                });

                displayTerms(filteredTerms);
                
                // Clear active filter button during search
                const buttons = document.querySelectorAll('.filter-btn');
                buttons.forEach(btn => btn.classList.remove('active'));
            });
        }

        function setActiveFilterButton(button) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }
    </script>
